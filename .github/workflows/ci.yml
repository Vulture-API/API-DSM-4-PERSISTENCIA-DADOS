name: CI
on:
  push:
    branches: [dev, main, 'SCRUM-*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telemetry_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      RUN_INTEGRATION: '1'
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/telemetry_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test,lint]' build
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Tests and coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=reports/junit.xml
      - name: Require integration execution without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('reports/junit.xml').getroot()
          cases = list(root.iter('testcase'))
          assert cases and not list(root.iter('skipped')), 'Required tests were skipped'
          assert sum('test_real_' in case.attrib['name'] for case in cases) >= 2
          PY
      - name: Package
        run: python -m build
      - name: Docker build and non-root check
        run: |
          docker build -t station-persist:ci .
          test "$(docker run --rm --entrypoint id station-persist:ci -u)" != 0
          docker run --rm station-persist:ci --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            coverage.xml
            reports/
            dist/
